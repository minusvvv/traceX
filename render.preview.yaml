# Staging only: free services sleep on idle. Do not use this plan as the
# production availability target. Applying this file requires Render access.
services:
  - type: web
    name: tracex-api-preview
    runtime: node
    plan: free
    repo: https://github.com/minusvvv/traceX
    branch: fix/vercel-production-readiness
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MONGO_TRANSACTIONS
        sync: false
      - key: MONGO_AUTO_INDEX
        value: "true" # new, isolated staging DB only; never apply to existing production data
      - key: FORCE_HTTPS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_EMPTY
        value: "false"
      - key: ALLOW_SIMULATION
        value: "false"
